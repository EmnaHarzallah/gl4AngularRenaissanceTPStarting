<h2>Todos</h2>

<form class="todo-form" (ngSubmit)="add()">
  <input type="text" name="name" placeholder="name" [(ngModel)]="name" />
  <input type="text" name="content" placeholder="content" [(ngModel)]="content" />
  <button type="submit">add</button>
</form>

<div class="board">
  @for (col of columns; track col.status) {
    <section class="column" [class]="col.css">
      <h3>{{ col.label }} ({{ col.todos().length }})</h3>

      @for (todo of col.todos(); track todo.id) {
        <article class="todo-card">
          <strong>{{ todo.name }}</strong>
          <p>{{ todo.content }}</p>

          <div class="actions">
            <select (change)="onStatusChange(todo.id, $event)">
              @for (opt of columns; track opt.status) {
                <option [value]="opt.status" [selected]="opt.status === todo.status">
                  {{ opt.label }}
                </option>
              }
            </select>
            <button type="button" class="danger" (click)="remove(todo.id)">✕</button>
          </div>
        </article>
      }
    </section>
  }
</div>
