<form [formGroup]="form">
  <input type="text" class="form-control" formControlName="search" />
</form>

@if (cvs$ | async; as cvs) {
  <ul>
    @for (cv of cvs; track cv.id) {
      <li (click)="selectCv(cv)" style="cursor: pointer;">
        {{ cv.firstname }} {{ cv.name }}
      </li>
    }
  </ul>
}
