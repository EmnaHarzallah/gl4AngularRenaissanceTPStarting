<ol class="list-group">
  @for (cv of cvs(); track cv.id; let isOdd = $odd) {
    <li
      [ngClass]="{
        'list-group-item-primary': isOdd,
        'list-group-item-secondary': !isOdd
      }"
      class="list-group-item"
      [class.cursor-pointer]="detailsPath()"
      [routerLink]="detailsPath() ? [detailsPath(), cv.id] : null"
      routerLinkActive="active"
    >
      <app-item [cv]="cv"></app-item>
    </li>
  }
</ol>
